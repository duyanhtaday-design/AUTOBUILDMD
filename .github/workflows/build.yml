
name: AutoBuilderPlus Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Gradle Wrapper
        id: locate
        shell: bash
        run: |
          echo "Searching for Gradle Wrapper..."

          find . -type f -name gradlew -print

          FILE=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: gradlew does not exist!"
            echo "Upload Gradle Wrapper to GitHub first."
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoBuilderPlus-1.0.0
          path: '**/build/libs/*.jar'
          if-no-files-found: error
